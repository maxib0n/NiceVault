[workspace]
resolver = "3"
members = [
    "crates/nv-fs", "crates/nv-core", "crates/nv-mount", "app/src-tauri",
]

[workspace.package]
edition = "2024"
version = "0.3.1"
license = "GPL-3.0-or-later"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

# winfsp-sys only supports *-windows-msvc; this copy also accepts x86_64-pc-windows-gnu (the
# Linux cross build in scripts/build-all.sh) and links a delay-import lib there. Only compiled
# for Windows targets.
[patch.crates-io]
winfsp-sys = { path = "third_party/winfsp-sys" }
# RPC record size cap (third_party/nfsserve/PATCHED.md)
nfsserve = { path = "third_party/nfsserve" }
