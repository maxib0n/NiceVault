[workspace]
resolver = "3"
members = [
    "crates/nv-fs", "crates/nv-core", "crates/nv-mount", "app/src-tauri",
]

[workspace.package]
edition = "2024"
version = "0.3.2"
license = "GPL-3.0-or-later"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
winfsp-sys = { path = "third_party/winfsp-sys" }
nfsserve = { path = "third_party/nfsserve" }
