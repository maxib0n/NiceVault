[package]
name = "nicevault-app"
description = "NiceVault desktop shell (Tauri 2)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[lib]
name = "nicevault_app"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nicevault"
path = "src/main.rs"

[features]
default = [
    "custom-protocol",
]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nv-fs = { path = "../../crates/nv-fs" }
nv-core = { path = "../../crates/nv-core" }
nv-mount = { path = "../../crates/nv-mount" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2.5"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = "0.10"
getrandom = "0.3"
open = "5"
url = "2"
dirs = "6"
log = "0.4"
base64 = "0.22"
minisign-verify = "0.3.0"
semver = "1.0.28"
ureq = { version = "3.5.0", default-features = false, features = ["native-tls"] }
sha2 = "0.10"
fs4 = "0.13"
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "gif", "webp", "bmp"] }
resvg = { version = "0.49", default-features = false }
nv-bridge = { path = "../../crates/nv-bridge" }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
hkdf = "0.12"
hmac = "0.12"
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
tempfile = "3"
blake3 = "1"
sha2 = "0.10"
tiny_http = "0.12.0"
minisign = "0.10.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.4"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-fs = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
