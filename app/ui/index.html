<!doctype html>
<html lang="it" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- the page never zooms (a phone: double tap, pinch); only the picture viewer does (lib/gestures.ts).
         viewport-fit=cover: the paper runs under the notch and the home bar, the content is padded
         by env(safe-area-inset-*) (styles/mobile.css) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>NiceVault</title>
    <!-- no inline <style> here: Tauri would add its hash to the CSP, which turns off 'unsafe-inline'
         for the styles the glyph decode injects. The window's own backgroundColor (tauri.conf.json)
         covers the frames before the stylesheet. -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
